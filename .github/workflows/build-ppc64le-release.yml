name: Build SkiaSharp ppc64le Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SkiaSharp source tag, e.g. v4.151.1"
        required: true
        type: string
        default: "v4.151.1"

permissions:
  contents: write

concurrency:
  group: build-ppc64le-${{ inputs.version }}
  cancel-in-progress: false

env:
  PATCH_REPO: autorepobot/SkiaSharp-ppc64le
  PATCH_REF: main
  GLIBC_MAX_VERSION: "2.38"

jobs:
  # ===========================================================================
  # 步骤 1：准备阶段 - 校验版本并动态生成对应主版本的构建 Matrix
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      major: ${{ steps.set-matrix.outputs.major }}
    steps:
      - name: Validate version & Generate Matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version/tag: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" =~ ^v4\. ]]; then
            MAJOR="4"
            # v4 完整矩阵生成
            MATRIX_JSON=$(cat <<'EOF'
          {
            "include": [
              {"arch": "arm64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/arm64"},
              {"arch": "arm64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/arm64"},
              {"arch": "arm", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.35", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/arm"},
              {"arch": "arm", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.35", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/arm"},
              {"arch": "x64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/x64"},
              {"arch": "x64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/x64"},
              {"arch": "riscv64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.39", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/riscv64"},
              {"arch": "riscv64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.39", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/riscv64"},
              {"arch": "loongarch64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.42", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/loongarch64"},
              {"arch": "loongarch64", "docker_dir": "scripts/infra/native/linux/docker/glibc", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.42", "image_tag": "skiasharp-glibc", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/loongarch64"},

              {"arch": "x86", "docker_dir": "scripts/infra/native/linux/docker/glibc-x86", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc-x86", "no_arch_arg": "1", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/x86"},
              {"arch": "x86", "docker_dir": "scripts/infra/native/linux/docker/glibc-x86", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc-x86", "no_arch_arg": "1", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/x86"},

              {"arch": "ppc64le", "docker_dir": "scripts/infra/native/linux/docker/glibc-ppc64le", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc-ppc64le", "no_arch_arg": "1", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/ppc64le"},
              {"arch": "ppc64le", "docker_dir": "scripts/infra/native/linux/docker/glibc-ppc64le", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.27", "image_tag": "skiasharp-glibc-ppc64le", "no_arch_arg": "1", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/ppc64le"},

              {"arch": "arm", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/arm"},
              {"arch": "arm", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/arm"},
              {"arch": "arm64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/arm64"},
              {"arch": "arm64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/arm64"},
              {"arch": "x64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/x64"},
              {"arch": "x64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/x64"},
              {"arch": "riscv64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/riscv64"},
              {"arch": "riscv64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/riscv64"},
              {"arch": "loongarch64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/loongarch64"},
              {"arch": "loongarch64", "docker_dir": "scripts/infra/native/linux/docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/loongarch64"},

              {"arch": "arm64", "docker_dir": "scripts/infra/native/linux/docker/bionic", "variant": "bionic", "gn_args": "", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-bionic", "target": "externals-linux", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/bionic/arm64"},
              {"arch": "x64", "docker_dir": "scripts/infra/native/linux/docker/bionic", "variant": "bionic", "gn_args": "", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-bionic", "target": "externals-linux", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/bionic/x64"}
            ]
          }
          EOF
          )
          elif [[ "$VERSION" =~ ^v3\. ]]; then
            MAJOR="3"
            # v3 完整矩阵生成
            MATRIX_JSON=$(cat <<'EOF'
          {
            "include": [
              {"arch": "arm", "docker_dir": "scripts/Docker/debian/10", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/arm"},
              {"arch": "arm", "docker_dir": "scripts/Docker/debian/10", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/arm"},
              {"arch": "arm64", "docker_dir": "scripts/Docker/debian/10", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/arm64"},
              {"arch": "arm64", "docker_dir": "scripts/Docker/debian/10", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/arm64"},
              {"arch": "x86", "docker_dir": "scripts/Docker/debian/10", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/x86"},
              {"arch": "x86", "docker_dir": "scripts/Docker/debian/10", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/x86"},
              {"arch": "x64", "docker_dir": "scripts/Docker/debian/10", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/x64"},
              {"arch": "x64", "docker_dir": "scripts/Docker/debian/10", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/x64"},
              {"arch": "riscv64", "docker_dir": "scripts/Docker/debian/10", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/riscv64"},
              {"arch": "riscv64", "docker_dir": "scripts/Docker/debian/10", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-debian10", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/riscv64"},

              {"arch": "loongarch64", "docker_dir": "scripts/Docker/debian/13", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.38", "image_tag": "skiasharp-debian13", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/loongarch64"},
              {"arch": "loongarch64", "docker_dir": "scripts/Docker/debian/13", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.38", "image_tag": "skiasharp-debian13", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/loongarch64"},
              {"arch": "ppc64le", "docker_dir": "scripts/Docker/debian/13", "variant": "linux", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig --verifyGlibcMax=2.38", "image_tag": "skiasharp-debian13", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/linux/ppc64le"},
              {"arch": "ppc64le", "docker_dir": "scripts/Docker/debian/13", "variant": "linuxnodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig --verifyGlibcMax=2.38", "image_tag": "skiasharp-debian13", "libs": "libSkiaSharp", "out_dir": "output/native/linuxnodeps/ppc64le"},

              {"arch": "arm", "docker_dir": "scripts/Docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/arm"},
              {"arch": "arm", "docker_dir": "scripts/Docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/arm"},
              {"arch": "arm64", "docker_dir": "scripts/Docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/arm64"},
              {"arch": "arm64", "docker_dir": "scripts/Docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/arm64"},
              {"arch": "x64", "docker_dir": "scripts/Docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/x64"},
              {"arch": "x64", "docker_dir": "scripts/Docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/x64"},
              {"arch": "riscv64", "docker_dir": "scripts/Docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/riscv64"},
              {"arch": "riscv64", "docker_dir": "scripts/Docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/riscv64"},
              {"arch": "loongarch64", "docker_dir": "scripts/Docker/alpine", "variant": "alpine", "gn_args": "", "extra_args": "--verifyIncluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/alpine/loongarch64"},
              {"arch": "loongarch64", "docker_dir": "scripts/Docker/alpine", "variant": "alpinenodeps", "gn_args": "skia_use_fontconfig=false", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-alpine", "libs": "libSkiaSharp", "out_dir": "output/native/alpinenodeps/loongarch64"},

              {"arch": "arm64", "docker_dir": "scripts/Docker/bionic", "variant": "bionic", "gn_args": "", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-bionic", "target": "externals-linux", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/bionic/arm64"},
              {"arch": "x64", "docker_dir": "scripts/Docker/bionic", "variant": "bionic", "gn_args": "", "extra_args": "--verifyExcluded=fontconfig", "image_tag": "skiasharp-bionic", "target": "externals-linux", "libs": "libSkiaSharp libHarfBuzzSharp", "out_dir": "output/native/bionic/x64"}
            ]
          }
          EOF
          )
          else
            echo "Unsupported SkiaSharp major version: $VERSION"
            exit 1
          fi

          echo "matrix=$(echo "${MATRIX_JSON}" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 步骤 2：并行执行构建 Job (Matrix 由 prepare 动态传入)
  # ===========================================================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout SkiaSharp source tag
        uses: actions/checkout@v4
        with:
          repository: mono/SkiaSharp
          ref: ${{ inputs.version }}
          submodules: recursive
          fetch-depth: 1

      - name: Download ppc64le patches
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ needs.prepare.outputs.major }}"

          if [[ "${MAJOR}" == "4" ]]; then
            SKIASHARP_PATCH="SkiaSharp-v4.diff"
          else
            SKIASHARP_PATCH="SkiaSharp-v3.diff"
          fi

          curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/${SKIASHARP_PATCH}" -o SkiaSharp.diff
          curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia.diff" -o skia.diff

          if [[ "${MAJOR}" == "3" ]]; then
            curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia-v3.diff" -o skia-v3.diff
          fi

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ needs.prepare.outputs.major }}"

          git apply --verbose SkiaSharp.diff
          git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia.diff"

          if [[ "${MAJOR}" == "3" ]]; then
            git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia-v3.diff"
          fi

      - name: Build Target (${{ matrix.arch }} - ${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail

          ARCH="${{ matrix.arch }}"
          DOCKER_DIR="${{ matrix.docker_dir }}"
          VARIANT="${{ matrix.variant }}"
          GN_ARGS="${{ matrix.gn_args }}"
          EXTRA_ARGS="${{ matrix.extra_args }}"
          IMAGE_TAG="${{ matrix.image_tag }}"
          NO_ARCH_ARG="${{ matrix.no_arch_arg }}"
          TARGET="${{ matrix.target }}"
          TARGET="${TARGET:-externals-linux-clang-cross}"

          echo "=========================================================="
          echo "[docker build] dir=${DOCKER_DIR} arch=${ARCH} image=${IMAGE_TAG}"
          echo "=========================================================="

          if [[ "${NO_ARCH_ARG:-}" == "1" ]]; then
            docker build --platform linux/amd64 --tag "${IMAGE_TAG}" "${DOCKER_DIR}"
          else
            docker build --platform linux/amd64 --tag "${IMAGE_TAG}" --build-arg BUILD_ARCH="${ARCH}" "${DOCKER_DIR}"
          fi

          cat > cmd.sh <<EOF
          set -euo pipefail
          dotnet tool restore
          dotnet cake --target=${TARGET} --verbosity=normal --configuration=Release \
            --buildarch=${ARCH} --variant=${VARIANT} --gnArgs="${GN_ARGS} " ${EXTRA_ARGS}
          EOF

          docker run --rm \
            --name "skiasharp-${IMAGE_TAG}-${ARCH}-${VARIANT}-${GITHUB_RUN_ID}" \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            --env GLIBC_MAX_VERSION="${GLIBC_MAX_VERSION}" \
            "${IMAGE_TAG}" \
            /bin/bash /work/cmd.sh

      - name: Verify Target Binaries
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="${{ matrix.out_dir }}"
          LIBS="${{ matrix.libs }}"

          for LIB in ${LIBS}; do
            SO="${OUT_DIR}/${LIB}.so"
            if [[ ! -f "$SO" ]]; then
              echo "ERROR: missing $SO"
              exit 1
            fi
            echo "=== $SO ==="
            file "$SO"
          done

      - name: Check ELF architecture (ppc64le only)
        if: matrix.arch == 'ppc64le'
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ matrix.out_dir }}"
          LIBS="${{ matrix.libs }}"

          for LIB in ${LIBS}; do
            SO="${OUT_DIR}/${LIB}.so"
            if ! file "$SO" | grep -Eq 'PowerPC|powerpc64|ppc64'; then
              echo "ERROR: $SO is not a ppc64le ELF binary"
              exit 1
            fi
          done

      - name: Fix workspace ownership
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" .

      # --------------------------------------------------------------------
      # 新增：把本矩阵项产出的 .so 上传为独立 artifact，供 package job 汇总
      # artifact 名称按 out_dir 编码（把 "/" 换成 "-"），保证每个矩阵项唯一
      # --------------------------------------------------------------------
      - name: Upload native output
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}-${{ matrix.variant }}
          path: ${{ matrix.out_dir }}/
          if-no-files-found: error
          retention-days: 3

  # ===========================================================================
  # 步骤 3：汇总所有矩阵产物，打包 nupkg，校验，发布 Release
  # ===========================================================================
  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      SKIASHARP_MAJOR: ${{ needs.prepare.outputs.major }}
    steps:
      - name: Checkout SkiaSharp source tag
        uses: actions/checkout@v4
        with:
          repository: mono/SkiaSharp
          ref: ${{ inputs.version }}
          submodules: recursive
          fetch-depth: 1

      - name: Download ppc64le patches
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SKIASHARP_MAJOR}" == "4" ]]; then
            SKIASHARP_PATCH="SkiaSharp-v4.diff"
          else
            SKIASHARP_PATCH="SkiaSharp-v3.diff"
          fi

          curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/${SKIASHARP_PATCH}" -o SkiaSharp.diff
          curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia.diff" -o skia.diff

          if [[ "${SKIASHARP_MAJOR}" == "3" ]]; then
            curl -fsSL "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia-v3.diff" -o skia-v3.diff
          fi

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail

          git apply --verbose SkiaSharp.diff
          git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia.diff"

          if [[ "${SKIASHARP_MAJOR}" == "3" ]]; then
            git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia-v3.diff"
          fi

      # --------------------------------------------------------------------
      # 下载 build job 产出的所有矩阵 artifact，还原回各自的 out_dir
      # --------------------------------------------------------------------
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _artifacts

      - name: Reassemble output/native tree
        shell: bash
        run: |
          set -euo pipefail

          MATRIX_JSON='${{ needs.prepare.outputs.matrix }}'

          echo "$MATRIX_JSON" | jq -c '.include[]' | while read -r ITEM; do
            ARCH="$(echo "$ITEM" | jq -r '.arch')"
            VARIANT="$(echo "$ITEM" | jq -r '.variant')"
            OUT_DIR="$(echo "$ITEM" | jq -r '.out_dir')"

            SRC="_artifacts/native-${ARCH}-${VARIANT}"
            if [[ ! -d "$SRC" ]]; then
              echo "ERROR: missing artifact directory $SRC (arch=$ARCH variant=$VARIANT)"
              exit 1
            fi

            mkdir -p "$OUT_DIR"
            cp -a "${SRC}/." "${OUT_DIR}/"
          done

          echo "=== Reassembled output/native tree ==="
          find output/native -maxdepth 3 -type f -print

      - name: Compute package/release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          echo "SOURCE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"

      - name: "Pack NuGet packages"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/ppc64le-release

          dotnet pack binding/SkiaSharp.NativeAssets.Linux/SkiaSharp.NativeAssets.Linux.csproj \
            -c Release -o output/ppc64le-release
          dotnet pack binding/SkiaSharp.NativeAssets.Linux.NoDependencies/SkiaSharp.NativeAssets.Linux.NoDependencies.csproj \
            -c Release -o output/ppc64le-release
          dotnet pack binding/HarfBuzzSharp.NativeAssets.Linux/HarfBuzzSharp.NativeAssets.Linux.csproj \
            -c Release -o output/ppc64le-release

      - name: "Verify generated packages contain official RIDs + ppc64le"
        shell: bash
        run: |
          set -euo pipefail
          cd output/ppc64le-release

          shopt -s nullglob
          PACKAGES=( *.nupkg )

          if [[ ${#PACKAGES[@]} -ne 3 ]]; then
            echo "Expected exactly 3 nupkg files, found ${#PACKAGES[@]}"
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi

          REQUIRED_RIDS_COMMON=(
            "linux-x64" "linux-x86" "linux-arm" "linux-arm64" "linux-riscv64" "linux-loongarch64"
            "linux-musl-x64" "linux-musl-arm" "linux-musl-arm64" "linux-musl-riscv64" "linux-musl-loongarch64"
            "linux-ppc64le"
          )
          # bionic 只存在于 SkiaSharp.NativeAssets.Linux / HarfBuzzSharp.NativeAssets.Linux，NoDependencies 没有
          REQUIRED_RIDS_BIONIC=("linux-bionic-x64" "linux-bionic-arm64")

          for PKG in "${PACKAGES[@]}"; do
            echo
            echo "========================================"
            echo "$PKG"
            echo "========================================"

            unzip -l "$PKG"

            echo
            echo "--- Runtime entries ---"
            unzip -l "$PKG" | grep 'runtimes/' || true

            for RID in "${REQUIRED_RIDS_COMMON[@]}"; do
              if ! unzip -l "$PKG" | grep -q "runtimes/${RID}/native/"; then
                echo "ERROR: $PKG does not contain runtimes/${RID}/native/"
                exit 1
              fi
            done

            if [[ "$PKG" != *NoDependencies* ]]; then
              for RID in "${REQUIRED_RIDS_BIONIC[@]}"; do
                if ! unzip -l "$PKG" | grep -q "runtimes/${RID}/native/"; then
                  echo "ERROR: $PKG does not contain runtimes/${RID}/native/"
                  exit 1
                fi
              done
            fi

            echo "OK: $PKG 包含官方完整 RID 集合 + linux-ppc64le"
          done

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd output/ppc64le-release

          sha256sum *.nupkg > SHA256SUMS.txt

          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skiasharp-ppc64le-${{ env.SOURCE_VERSION }}
          path: |
            output/ppc64le-release/*.nupkg
            output/ppc64le-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${RELEASE_TAG}" \
            output/ppc64le-release/*.nupkg \
            output/ppc64le-release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SkiaSharp ${{ inputs.version }}" \
            --generate-notes

      - name: Print release information
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "ppc64le Release"
          echo "========================================"
          echo "Source tag:      ${{ inputs.version }}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release tag:     ${RELEASE_TAG}"
          echo
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
