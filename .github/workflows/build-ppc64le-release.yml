name: Build SkiaSharp ppc64le Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SkiaSharp source tag, e.g. v4.151.1"
        required: true
        type: string
        default: "v4.151.1"

permissions:
  contents: write

concurrency:
  group: build-ppc64le-${{ inputs.version }}
  cancel-in-progress: false

env:
  PATCH_REPO: autorepobot/SkiaSharp-ppc64le
  PATCH_REF: main
  GLIBC_MAX_VERSION: "2.38"   # only used by the [v3] branch (debian/13 image)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version/tag: $VERSION"
            echo "Expected something like: v3.119.4"
            exit 1
          fi

          if [[ "$VERSION" =~ ^v4\. ]]; then
            echo "SKIASHARP_MAJOR=4" >> "$GITHUB_ENV"
          elif [[ "$VERSION" =~ ^v3\. ]]; then
            echo "SKIASHARP_MAJOR=3" >> "$GITHUB_ENV"
          else
            echo "Unsupported SkiaSharp major version: $VERSION"
            echo "Supported versions: v3.x.x and v4.x.x"
            exit 1
          fi

          echo "SOURCE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout SkiaSharp source tag
        uses: actions/checkout@v4
        with:
          repository: mono/SkiaSharp
          ref: ${{ inputs.version }}
          submodules: recursive
          fetch-depth: 1

      - name: Show source and submodule revisions
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SkiaSharp ==="
          git rev-parse HEAD
          git describe --tags --always || true

          echo
          echo "=== Submodules ==="
          git submodule status --recursive

          echo
          echo "=== externals/skia ==="
          git -C externals/skia rev-parse HEAD
          git -C externals/skia describe --always || true

      - name: Download ppc64le patches
        shell: bash
        run: |
          set -euo pipefail

          case "${SKIASHARP_MAJOR}" in
            4)
              SKIASHARP_PATCH="SkiaSharp-v4.diff"
              ;;
            3)
              SKIASHARP_PATCH="SkiaSharp-v3.diff"
              ;;
            *)
              echo "Unsupported SkiaSharp major version: ${SKIASHARP_MAJOR}"
              exit 1
              ;;
          esac

          echo "SKIASHARP_PATCH=${SKIASHARP_PATCH}" >> "$GITHUB_ENV"

          echo "Using SkiaSharp patch: ${SKIASHARP_PATCH}"

          curl -fsSL \
            "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/${SKIASHARP_PATCH}" \
            -o SkiaSharp.diff

          curl -fsSL \
            "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia.diff" \
            -o skia.diff

          echo "=== Patch files (common) ==="
          ls -lh SkiaSharp.diff skia.diff

          if [[ "${SKIASHARP_MAJOR}" == "3" ]]; then
            curl -fsSL \
              "https://raw.githubusercontent.com/${PATCH_REPO}/${PATCH_REF}/skia-v3.diff" \
              -o skia-v3.diff

            echo "=== Patch files (v3 extra) ==="
            ls -lh skia-v3.diff
          fi

      - name: Apply SkiaSharp main-repository patch
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SkiaSharp.diff..."
          git apply --check SkiaSharp.diff

          echo "Applying SkiaSharp.diff..."
          git apply --verbose SkiaSharp.diff

      - name: Apply Skia submodule patch
        shell: bash
        run: |
          set -euo pipefail

          test -d externals/skia
          test -f externals/skia/third_party/libpng/BUILD.gn

          echo "Checking skia.diff inside externals/skia..."
          git -C externals/skia apply --check "$GITHUB_WORKSPACE/skia.diff"

          echo "Applying skia.diff inside externals/skia..."
          git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia.diff"

          if [[ "${SKIASHARP_MAJOR}" == "3" ]]; then
            test -f "$GITHUB_WORKSPACE/skia-v3.diff"

            echo "Checking skia-v3.diff inside externals/skia..."
            git -C externals/skia apply --check "$GITHUB_WORKSPACE/skia-v3.diff"

            echo "Applying skia-v3.diff inside externals/skia..."
            git -C externals/skia apply --verbose "$GITHUB_WORKSPACE/skia-v3.diff"
          fi

      - name: Verify ppc64le patch result
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Main repository changes ==="
          git status --short

          echo
          echo "=== Selected version ==="
          echo "SkiaSharp major: ${SKIASHARP_MAJOR}"
          echo "SkiaSharp patch: ${SKIASHARP_PATCH}"

          echo
          echo "=== Check Linux native packaging changes (csproj) ==="
          grep -n "linux-ppc64le" \
            binding/SkiaSharp.NativeAssets.Linux/SkiaSharp.NativeAssets.Linux.csproj

          grep -n "linux-ppc64le" \
            binding/SkiaSharp.NativeAssets.Linux.NoDependencies/SkiaSharp.NativeAssets.Linux.NoDependencies.csproj

          grep -n "linux-ppc64le" \
            binding/HarfBuzzSharp.NativeAssets.Linux/HarfBuzzSharp.NativeAssets.Linux.csproj

          echo
          echo "=== Check Linux native packaging changes (buildTransitive targets) ==="
          grep -n "linux-ppc64le" \
            binding/SkiaSharp.NativeAssets.Linux/buildTransitive/net4/SkiaSharp.targets

          grep -n "linux-ppc64le" \
            binding/SkiaSharp.NativeAssets.Linux.NoDependencies/buildTransitive/net4/SkiaSharp.targets

          grep -n "linux-ppc64le" \
            binding/HarfBuzzSharp.NativeAssets.Linux/buildTransitive/net4/HarfBuzzSharp.targets

          echo
          echo "=== Check Skia libpng patch ==="
          grep -n "current_cpu == \"ppc64\"" \
            externals/skia/third_party/libpng/BUILD.gn

          grep -n "filter_vsx_intrinsics.c" \
            externals/skia/third_party/libpng/BUILD.gn

          if [[ "${SKIASHARP_MAJOR}" == "4" ]]; then
            echo
            echo "=== Check v4 ppc64le files ==="
            test -f scripts/infra/native/linux/docker/glibc-ppc64le/Dockerfile
            test -f scripts/infra/native/linux/docker/glibc-ppc64le/startup.sh

            grep -n "arch: ppc64le" \
              scripts/azure-templates-stages-native-linux.yml

          elif [[ "${SKIASHARP_MAJOR}" == "3" ]]; then
            echo
            echo "=== Check v3 ppc64le build files (reuses debian/13 image) ==="
            test -f scripts/Docker/debian/13/Dockerfile
            test -f scripts/Docker/debian/13/build-local.sh

            echo
            echo "=== Check v3 ppc64le Docker changes ==="
            grep -n "ppc64le" scripts/Docker/debian/13/Dockerfile
            grep -n "ppc64le" scripts/Docker/debian/13/build-local.sh

            echo
            echo "=== Check v3 ppc64le 已经并入官方 native-linux 矩阵 ==="
            grep -n -B2 "arch: ppc64le" \
              scripts/azure-templates-stages-native-linux.yml

            echo
            echo "=== Check v3 ppc64le 已经并入官方 native-merge requiredArtifacts ==="
            grep -n "native_linux_ppc64le" \
              scripts/azure-templates-stages-native-merge.yml

            echo
            echo "=== Check v3 cake ReduceArch ppc64le 分支 ==="
            grep -n -A1 'case "ppc64le"' \
              scripts/cake/native-shared.cake

            echo
            echo "=== Check v3 musttail (JUMPER_MUSTTAIL / SKRP_MUSTTAIL) patch ==="
            grep -n -A2 "^#if SK_HAS_MUSTTAIL" \
              externals/skia/src/opts/SkRasterPipeline_opts.h
            grep -n "SK_HAS_MUSTTAIL && !defined(__powerpc64__)" \
              externals/skia/src/opts/SkRasterPipeline_opts.h
          fi

      # ===========================================================================
      # [v4 分支] 改为：走"官方完整 Linux 矩阵 + ppc64le"路径
      #
      # 依据 scripts/azure-templates-stages-native-linux.yml 官方矩阵定义：
      #   glibc: arm64, x86, arm, x64, riscv64, loongarch64（各自不同 verifyGlibcMax）
      #   glibc: ppc64le（补丁新增，专用 glibc-ppc64le 镶像，因为 .NET 官方不提供
      #          ppc64le 的 libc++，需要在镜像里自行构建，和 x86 同构，verifyGlibcMax=2.27）
      #   musl:  alpine → arm, arm64, x64, riscv64, loongarch64（官方矩阵没有 musl-x86）
      #   bionic: bionic → arm64, x64（只有默认 variant，没有 nodeps）
      # 每个 glibc/musl 架构都跑 default(--verifyIncluded=fontconfig) 和
      # nodeps(--verifyExcluded=fontconfig --gnArgs=skia_use_fontconfig=false) 两次。
      # ===========================================================================
      - name: "[v4] Build full official Linux matrix + ppc64le"
        if: env.SKIASHARP_MAJOR == '4'
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool restore

          # $1 ARCH  $2 DOCKER_DIR  $3 VARIANT  $4 GN_ARGS  $5 EXTRA_ARGS
          # $6 IMAGE_TAG  $7 NO_BUILD_ARCH_ARG (set to "1" for self-contained
          #    Dockerfiles that don't accept --build-arg BUILD_ARCH, i.e. x86/ppc64le)
          build_one () {
            local ARCH="$1" DOCKER_DIR="$2" VARIANT="$3" GN_ARGS="$4" EXTRA_ARGS="$5" IMAGE_TAG="$6" NO_ARCH_ARG="${7:-}"

            echo
            echo "=========================================================="
            echo "[docker build] dir=${DOCKER_DIR} arch=${ARCH} image=${IMAGE_TAG}"
            echo "=========================================================="
            if [[ "${NO_ARCH_ARG}" == "1" ]]; then
              docker build \
                --platform linux/amd64 \
                --tag "${IMAGE_TAG}" \
                "${DOCKER_DIR}"
            else
              docker build \
                --platform linux/amd64 \
                --tag "${IMAGE_TAG}" \
                --build-arg BUILD_ARCH="${ARCH}" \
                "${DOCKER_DIR}"
            fi

            echo
            echo "=========================================================="
            echo "[cake] arch=${ARCH} variant=${VARIANT} gnArgs='${GN_ARGS}' extra='${EXTRA_ARGS}'"
            echo "=========================================================="

            cat > cmd.sh <<EOF
          set -euo pipefail
          dotnet cake --target=externals-linux-clang-cross --verbosity=normal --configuration=Release \\
            --buildarch=${ARCH} --variant=${VARIANT} --gnArgs="${GN_ARGS} " ${EXTRA_ARGS}
          EOF
            cat cmd.sh

            docker run --rm \
              --name "skiasharp-${IMAGE_TAG}-${ARCH}-${VARIANT}-${GITHUB_RUN_ID}" \
              --volume "${GITHUB_WORKSPACE}:/work" \
              --workdir /work \
              "${IMAGE_TAG}" \
              /bin/bash /work/cmd.sh
          }

          # ---------------- glibc: official cross images (default + nodeps) ----------------
          # arch  docker                                            verifyGlibcMax
          declare -A GLIBC_ARCH_MAX=(
            [arm64]=2.27
            [arm]=2.35
            [x64]=2.27
            [riscv64]=2.39
            [loongarch64]=2.42
          )
          for ARCH in arm64 arm x64 riscv64 loongarch64; do
            MAXV="${GLIBC_ARCH_MAX[$ARCH]}"
            build_one "${ARCH}" "scripts/infra/native/linux/docker/glibc" "linux" "" \
              "--verifyIncluded=fontconfig --verifyGlibcMax=${MAXV}" "skiasharp-glibc"
            build_one "${ARCH}" "scripts/infra/native/linux/docker/glibc" "linuxnodeps" "skia_use_fontconfig=false" \
              "--verifyExcluded=fontconfig --verifyGlibcMax=${MAXV}" "skiasharp-glibc"
          done

          # ---------------- glibc: x86 (self-contained Dockerfile, no BUILD_ARCH) ----------------
          build_one "x86" "scripts/infra/native/linux/docker/glibc-x86" "linux" "" \
            "--verifyIncluded=fontconfig --verifyGlibcMax=2.27" "skiasharp-glibc-x86" "1"
          build_one "x86" "scripts/infra/native/linux/docker/glibc-x86" "linuxnodeps" "skia_use_fontconfig=false" \
            "--verifyExcluded=fontconfig --verifyGlibcMax=2.27" "skiasharp-glibc-x86" "1"

          # ---------------- glibc: ppc64le (self-contained Dockerfile, no BUILD_ARCH) ----------------
          build_one "ppc64le" "scripts/infra/native/linux/docker/glibc-ppc64le" "linux" "" \
            "--verifyIncluded=fontconfig --verifyGlibcMax=2.27" "skiasharp-glibc-ppc64le" "1"
          build_one "ppc64le" "scripts/infra/native/linux/docker/glibc-ppc64le" "linuxnodeps" "skia_use_fontconfig=false" \
            "--verifyExcluded=fontconfig --verifyGlibcMax=2.27" "skiasharp-glibc-ppc64le" "1"

          # ---------------- musl: alpine (default + nodeps) — official matrix has no x86 ----------------
          for ARCH in arm arm64 x64 riscv64 loongarch64; do
            build_one "${ARCH}" "scripts/infra/native/linux/docker/alpine" "alpine" "" \
              "--verifyIncluded=fontconfig" "skiasharp-alpine"
            build_one "${ARCH}" "scripts/infra/native/linux/docker/alpine" "alpinenodeps" "skia_use_fontconfig=false" \
              "--verifyExcluded=fontconfig" "skiasharp-alpine"
          done

          # ---------------- bionic (只有默认 variant，没有 nodeps) ----------------
          for ARCH in arm64 x64; do
            build_one "${ARCH}" "scripts/infra/native/linux/docker/bionic" "bionic" "" \
              "--verifyExcluded=fontconfig" "skiasharp-bionic"
          done

      - name: "[v4] Fix workspace ownership"
        if: always() && env.SKIASHARP_MAJOR == '4'
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" .

      - name: "[v4] Verify native libraries (official matrix + ppc64le)"
        if: env.SKIASHARP_MAJOR == '4'
        shell: bash
        run: |
          set -euo pipefail

          declare -A DIR_TO_LIBS=(
            ["output/native/linux/arm"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/x86"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/x64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/riscv64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/loongarch64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/ppc64le"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linuxnodeps/arm"]="libSkiaSharp"
            ["output/native/linuxnodeps/arm64"]="libSkiaSharp"
            ["output/native/linuxnodeps/x86"]="libSkiaSharp"
            ["output/native/linuxnodeps/x64"]="libSkiaSharp"
            ["output/native/linuxnodeps/riscv64"]="libSkiaSharp"
            ["output/native/linuxnodeps/loongarch64"]="libSkiaSharp"
            ["output/native/linuxnodeps/ppc64le"]="libSkiaSharp"
            ["output/native/alpine/arm"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/x64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/riscv64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/loongarch64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpinenodeps/arm"]="libSkiaSharp"
            ["output/native/alpinenodeps/arm64"]="libSkiaSharp"
            ["output/native/alpinenodeps/x64"]="libSkiaSharp"
            ["output/native/alpinenodeps/riscv64"]="libSkiaSharp"
            ["output/native/alpinenodeps/loongarch64"]="libSkiaSharp"
            ["output/native/bionic/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/bionic/x64"]="libSkiaSharp libHarfBuzzSharp"
          )

          MISSING=0
          for OUTPUT_DIR in "${!DIR_TO_LIBS[@]}"; do
            for LIB in ${DIR_TO_LIBS[$OUTPUT_DIR]}; do
              SO="${OUTPUT_DIR}/${LIB}.so"

              if [[ ! -f "$SO" ]]; then
                echo "ERROR: missing $SO"
                MISSING=1
                continue
              fi

              echo "=== $SO ==="
              file "$SO"
            done
          done

          if [[ "${MISSING}" -ne 0 ]]; then
            echo
            echo "Produced files:"
            find output/native -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

      - name: "[v4] Check ppc64le ELF architecture"
        if: env.SKIASHARP_MAJOR == '4'
        shell: bash
        run: |
          set -euo pipefail

          for SO in \
            output/native/linux/ppc64le/libSkiaSharp.so \
            output/native/linux/ppc64le/libHarfBuzzSharp.so \
            output/native/linuxnodeps/ppc64le/libSkiaSharp.so
          do
            echo "=== $SO ==="
            file "$SO"

            if ! file "$SO" | grep -Eq 'PowerPC|powerpc64|ppc64'; then
              echo "ERROR: $SO does not look like a ppc64le ELF binary"
              exit 1
            fi
          done

      # ===========================================================================
      # [v3 分支] 保持不变：走"官方完整 Linux 矩阵 + ppc64le"路径
      #
      # 依据补丁内容，v3 的 ppc64le 已经被直接插入官方
      # scripts/azure-templates-stages-native-linux.yml 的矩阵里（复用 debian/13
      # 镜像，和 loongarch64 平级），因此这里按官方矩阵原样构建所有官方架构 + ppc64le：
      #   glibc:  debian/10  → arm, arm64, x86, x64, riscv64
      #   glibc:  debian/13  → loongarch64, ppc64le（均带 --verifyGlibcMax=2.38）
      #   musl:   alpine     → arm, arm64, x64, riscv64, loongarch64
      #   bionic: bionic     → arm64, x64（只有默认 variant，没有 nodeps）
      # 每个 glibc/musl 架构都跑 default(--verifyIncluded=fontconfig) 和
      # nodeps(--verifyExcluded=fontconfig --gnArgs=skia_use_fontconfig=false) 两次。
      # 不加任何签名/SDL 步骤 —— 签名只存在于官方独立的打包发布流水线
      # (azure-pipelines-package.yml + MicroBuild.1ES.Official.yml)，不属于原生构建阶段。
      # ===========================================================================
      - name: "[v3] Build full official Linux matrix + ppc64le"
        if: env.SKIASHARP_MAJOR == '3'
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool restore

          build_one () {
            local ARCH="$1" DOCKER_DIR="$2" VARIANT="$3" GN_ARGS="$4" EXTRA_ARGS="$5" IMAGE_TAG="$6"

            echo
            echo "=========================================================="
            echo "[docker build] dir=${DOCKER_DIR} arch=${ARCH} image=${IMAGE_TAG}"
            echo "=========================================================="
            docker build \
              --platform linux/amd64 \
              --tag "${IMAGE_TAG}" \
              --build-arg BUILD_ARCH="${ARCH}" \
              "${DOCKER_DIR}"

            echo
            echo "=========================================================="
            echo "[cake] arch=${ARCH} variant=${VARIANT} gnArgs='${GN_ARGS}' extra='${EXTRA_ARGS}'"
            echo "=========================================================="

            cat > cmd.sh <<EOF
          set -euo pipefail
          dotnet cake --target=externals-linux-clang-cross --verbosity=normal --configuration=Release \\
            --buildarch=${ARCH} --variant=${VARIANT} --gnArgs="${GN_ARGS} " ${EXTRA_ARGS}
          EOF
            cat cmd.sh

            docker run --rm \
              --name "skiasharp-${IMAGE_TAG}-${ARCH}-${VARIANT}-${GITHUB_RUN_ID}" \
              --volume "${GITHUB_WORKSPACE}:/work" \
              --workdir /work \
              --env GLIBC_MAX_VERSION="${GLIBC_MAX_VERSION}" \
              "${IMAGE_TAG}" \
              /bin/bash /work/cmd.sh
          }

          # ---------------- glibc: debian/10 (default + nodeps) ----------------
          for ARCH in arm arm64 x86 x64 riscv64; do
            build_one "${ARCH}" "scripts/Docker/debian/10" "linux" "" \
              "--verifyIncluded=fontconfig" "skiasharp-debian10"
            build_one "${ARCH}" "scripts/Docker/debian/10" "linuxnodeps" "skia_use_fontconfig=false" \
              "--verifyExcluded=fontconfig" "skiasharp-debian10"
          done

          # ---------------- glibc: debian/13 (loongarch64 + ppc64le, 均带 verifyGlibcMax) ----------------
          for ARCH in loongarch64 ppc64le; do
            build_one "${ARCH}" "scripts/Docker/debian/13" "linux" "" \
              "--verifyIncluded=fontconfig --verifyGlibcMax=${GLIBC_MAX_VERSION}" "skiasharp-debian13"
            build_one "${ARCH}" "scripts/Docker/debian/13" "linuxnodeps" "skia_use_fontconfig=false" \
              "--verifyExcluded=fontconfig --verifyGlibcMax=${GLIBC_MAX_VERSION}" "skiasharp-debian13"
          done

          # ---------------- musl: alpine (default + nodeps) ----------------
          for ARCH in arm arm64 x64 riscv64 loongarch64; do
            build_one "${ARCH}" "scripts/Docker/alpine" "alpine" "" \
              "--verifyIncluded=fontconfig" "skiasharp-alpine"
            build_one "${ARCH}" "scripts/Docker/alpine" "alpinenodeps" "skia_use_fontconfig=false" \
              "--verifyExcluded=fontconfig" "skiasharp-alpine"
          done

          # ---------------- bionic (只有默认 variant，没有 nodeps) ----------------
          for ARCH in arm64 x64; do
            build_one "${ARCH}" "scripts/Docker/bionic" "bionic" "" \
              "--verifyExcluded=fontconfig" "skiasharp-bionic"
          done

      - name: "[v3] Fix workspace ownership"
        if: always() && env.SKIASHARP_MAJOR == '3'
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" .

      - name: "[v3] Verify native libraries (official matrix + ppc64le)"
        if: env.SKIASHARP_MAJOR == '3'
        shell: bash
        run: |
          set -euo pipefail

          declare -A DIR_TO_LIBS=(
            ["output/native/linux/arm"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/x86"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/x64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/riscv64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/loongarch64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linux/ppc64le"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/linuxnodeps/arm"]="libSkiaSharp"
            ["output/native/linuxnodeps/arm64"]="libSkiaSharp"
            ["output/native/linuxnodeps/x86"]="libSkiaSharp"
            ["output/native/linuxnodeps/x64"]="libSkiaSharp"
            ["output/native/linuxnodeps/riscv64"]="libSkiaSharp"
            ["output/native/linuxnodeps/loongarch64"]="libSkiaSharp"
            ["output/native/linuxnodeps/ppc64le"]="libSkiaSharp"
            ["output/native/alpine/arm"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/x64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/riscv64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpine/loongarch64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/alpinenodeps/arm"]="libSkiaSharp"
            ["output/native/alpinenodeps/arm64"]="libSkiaSharp"
            ["output/native/alpinenodeps/x64"]="libSkiaSharp"
            ["output/native/alpinenodeps/riscv64"]="libSkiaSharp"
            ["output/native/alpinenodeps/loongarch64"]="libSkiaSharp"
            ["output/native/bionic/arm64"]="libSkiaSharp libHarfBuzzSharp"
            ["output/native/bionic/x64"]="libSkiaSharp libHarfBuzzSharp"
          )

          MISSING=0
          for OUTPUT_DIR in "${!DIR_TO_LIBS[@]}"; do
            for LIB in ${DIR_TO_LIBS[$OUTPUT_DIR]}; do
              SO="${OUTPUT_DIR}/${LIB}.so"

              if [[ ! -f "$SO" ]]; then
                echo "ERROR: missing $SO"
                MISSING=1
                continue
              fi

              echo "=== $SO ==="
              file "$SO"
            done
          done

          if [[ "${MISSING}" -ne 0 ]]; then
            echo
            echo "Produced files:"
            find output/native -maxdepth 3 -type f -print 2>/dev/null || true
